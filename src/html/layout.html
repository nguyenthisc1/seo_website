<!doctype html>
<html lang="vi">
    <head>
        <!-- Standard meta tags -->
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="{{ description }}" />
        <link rel="canonical" href="{{ client.domain }}{{ page.url }}" />
        <meta name="generator" content="{{ eleventy.generator }}" />

        <!--Social Media Display-->
        <meta property="og:title" content="{{ title }}" />
        <meta property="og:description" content="{{ description }}" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="{{ client.domain }}{{ page.url }}" />
        <meta property="og:image" content="{{ image or '/assets/images/logo-small.png' }}" />
        <meta property="og:image:secure_url" content="{{ image or '/assets/images/logo-small.png' }}" />

        <!--Favicons-->
        <!-- https://realfavicongenerator.net/ -->
        <link rel="icon" type="image/png" href="/assets/favicons/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg" />
        <link rel="shortcut icon" href="/assets/favicons/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Starter Kit" />
        <link rel="manifest" href="/assets/favicons/site.webmanifest" />

        {# --- Head block for page-specific additions --- #} {% block head %}{% endblock %}

        <link rel="stylesheet" href="/assets/styles/critical.css" />
        <link
            rel="preload"
            href="/assets/styles/app.css"
            as="style"
            onload="
                this.onload = null;
                this.rel = 'stylesheet';
            "
        />
        <noscript>
            <link rel="stylesheet" href="/assets/styles/app.css" />
        </noscript>
    </head>
    <body>
        <main id="main">{% block content %}{% endblock %}</main>

        <script type="module" src="/assets/scripts/main.js"></script>
    </body>
</html>
